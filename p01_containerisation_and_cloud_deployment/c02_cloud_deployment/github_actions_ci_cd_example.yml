# Example GitHub Actions workflow (CI/CD) for the iris API: test -> build & push image -> deploy to Cloud Run.
#
# This file is an EXAMPLE stored with the book chapter; it is not active here. To use it, copy it to
# .github/workflows/iris_api.yml in your repository and configure (Settings -> Secrets and variables -> Actions
# -> Variables), see book_cloud_deployment.md:
#   GCP_PROJECT_ID     e.g. my-project
#   GCP_REGION         e.g. europe-west6
#   GCP_ARTIFACT_REPO  name of the Artifact Registry docker repository, e.g. gzh
#   GCP_WIF_PROVIDER   full name of the Workload Identity Federation provider
#                      (projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>)
#   GCP_DEPLOY_SA      service account used for pushing and deploying, e.g. gh-deployer@my-project.iam.gserviceaccount.com
#   GCP_RUNTIME_SA     service account the Cloud Run service runs as, e.g. iris-api-runtime@my-project.iam.gserviceaccount.com
# No long-lived keys are needed: GitHub's OIDC token is exchanged for short-lived Google credentials. This only
# works after a one-off set-up on the Google Cloud side (workload identity pool, GitHub OIDC provider with an
# attribute condition restricting it to your repository, impersonation and role bindings of the service
# accounts): see "One-off set-up for the CI/CD workflow" in README.md for the gcloud commands.

name: iris-api CI/CD

on:
  push:
    branches: [main]
    paths:
      - "p00_fundamentals/c02_fastapi/**"
      - "p01_containerisation_and_cloud_deployment/c00_docker/**"
  pull_request:
    paths:
      - "p00_fundamentals/c02_fastapi/**"
      - "p01_containerisation_and_cloud_deployment/c00_docker/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: gzh-iris-api
  SERVICE_NAME: iris-api
  DOCKERFILE: p01_containerisation_and_cloud_deployment/c00_docker/Dockerfile
  REQUIREMENTS: p01_containerisation_and_cloud_deployment/c00_docker/requirements.txt

jobs:
  # 1. Continuous integration: unit tests of the API
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ env.REQUIREMENTS }}
      - name: Install dependencies
        run: pip install -r "$REQUIREMENTS" pytest httpx
      - name: Run tests
        run: python -m pytest p00_fundamentals/c02_fastapi -v

  # 2. Build the image, smoke-test the container, and push exactly this image (not for pull requests)
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # needed to request the OIDC token for Google Cloud
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Define the image reference (tagged with the commit SHA)
        id: vars
        run: |
          echo "image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/${IMAGE_NAME}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          load: true                  # make the image available to `docker run` below
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name api -p 5000:5000 "${IMAGE_NAME}:ci"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/ready; then break; fi
            sleep 1
          done
          curl -fsS -X POST http://localhost:5000/v1/predict -H "Content-Type: application/json" \
               -d '{"sepal_length": 5.1, "sepal_width": 3.5, "petal_length": 1.4, "petal_width": 0.2}'
          docker rm -f api

      - name: Authenticate to Google Cloud
        if: github.event_name != 'pull_request'
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      - name: Log in to Artifact Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Push the tested image (tagged with the commit SHA, no rebuild)
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
        run: |
          docker tag "${IMAGE_NAME}:ci" "$IMAGE"
          docker push "$IMAGE"

  # 3. Continuous deployment: only for pushes to main, gated by the "production" environment
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production         # can require a manual approval in the repository settings
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ needs.build.outputs.image }}
          env_vars: |
            LOG_LEVEL=INFO
            MAX_BATCH_SIZE=1000
          flags: >-
            --port=5000
            --cpu=1
            --memory=512Mi
            --min-instances=0
            --max-instances=3
            --concurrency=40
            --service-account=${{ vars.GCP_RUNTIME_SA }}
            --allow-unauthenticated

      - name: Smoke test the deployed service
        run: |
          curl -fsS "${{ steps.deploy.outputs.url }}/ready"
          curl -fsS "${{ steps.deploy.outputs.url }}/v1/model/metadata"
